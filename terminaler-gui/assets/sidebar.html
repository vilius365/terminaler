<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminaler Sidebar</title>
<style>
  /* ── Shared visual spec (V2 Tiles) ──────────────────────────────────────
     This :root block is the single source of truth for BOTH renderers; the
     GPU side mirrors it in SidebarTheme (tab_sidebar.rs). Keep in sync BY
     HAND.  Spec table:
       rail width   config tab_sidebar_width (180 reference)
       tile         anchored to both rail edges, width = rail - 2x6px
       sub-tile     indented 12px further left, single line
       status dot   INSIDE the tile, right end of the icon line
       notif badge  red count, left end of the icon line
       context bar  thin strip inside the tile bottom
       flyout       width follows the detail font (~38 avg chars), 200ms hover
       type scale   font_size x 0.8 x min(width/180, 1.15) — past ~207px the
                    rail fits MORE text, not bigger letters
     NOTE on opacity: the GPU rail runs its panel surfaces at 80% alpha. The
     WebView host is opaque (transparency needs the with_transparent spike),
     so alpha here would composite against white and wash out — colors stay
     solid until that spike lands. */
  :root {
    --bg-base: #121212;
    --bg-surface: #1a1a1a;
    --bg-elevated: #222222;
    --border-subtle: #2e2e2e;
    --border-default: #3a3a3a;
    --text-primary: #e0e0e0;
    --text-secondary: #999999;
    --text-tertiary: #666666;
    --accent-blue: #4d9eff;
    --accent-green: #3fb950;
    --accent-yellow: #d29922;
    --accent-red: #f85149;
    --accent-orange: #db8b0b;

    --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;

    --radius-sm: 4px;
    --radius-md: 6px;
    --transition: 150ms ease;

    /* JS sets --scale = min(railWidth/180, 1.15) on resize. */
    --scale: 1;
    --fs-label: calc(11px * var(--scale));
    --fs-eyebrow: calc(9px * var(--scale));
    --fs-icon: calc(14px * var(--scale));
    --fs-detail: calc(11px * var(--scale));

    --tile-margin: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-surface);
    font-family: var(--font-ui);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  /* Host layout: the flyout area takes whatever width Rust granted beyond the
     rail (set_flyout widens the host); the rail itself keeps its width. */
  body { display: flex; }
  .flyout-area { flex: 1; position: relative; min-width: 0; }
  .rail {
    width: var(--rail-w, 100%);
    flex: none;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg-surface);
  }
  body.flyout-open .rail { border-left: 1px solid var(--border-subtle); }
  body.pos-left { flex-direction: row-reverse; }
  body.pos-left.flyout-open .rail { border-left: none; border-right: 1px solid var(--border-subtle); }

  .rail-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .rail-scroll::-webkit-scrollbar { width: 0; }

  /* ── Eyebrows ── */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 6px 3px 8px;
    font-size: var(--fs-eyebrow);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
  }
  .eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .dot-green { background: var(--accent-green); }
  .dot-red { background: var(--accent-red); }
  .dot-gray { background: var(--text-tertiary); }
  .eyebrow.stale, .tile.stale { opacity: 0.55; }
  .box-error {
    font-size: calc(var(--fs-eyebrow) * 0.95);
    color: var(--text-tertiary);
    padding: 0 6px 2px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Tiles: anchored to both rail edges ── */
  .tile {
    margin: 0 var(--tile-margin) 6px var(--tile-margin);
    padding: 4px 4px;
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition);
    overflow: hidden;
  }
  .tile:hover { background: var(--bg-elevated); }
  .tile.active { background: var(--bg-elevated); border-color: var(--accent-blue); }
  .tile.st-green  { border-color: rgba(63,185,80,0.6); }
  .tile.st-yellow { border-color: rgba(210,153,34,0.6); }
  .tile.st-red    { border-color: rgba(248,81,73,0.6); }
  .tile.flashing { animation: flash-pulse 1.5s ease-in-out infinite; }
  @keyframes flash-pulse {
    0%, 100% { background: var(--bg-base); }
    50% { background: rgba(248, 81, 73, 0.25); }
  }

  .tile-iconline {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: calc(var(--fs-icon) * 1.3);
    font-size: var(--fs-icon);
    line-height: 1.1;
  }
  .tile-iconline.centered { justify-content: center; }
  .t-icon { color: var(--text-secondary); flex: none; line-height: 1; }
  .t-icon.claude, .t-icon.instance { color: var(--accent-orange); }
  /* Icons as CSS-mask SVGs: text glyphs beyond guaranteed font coverage
     render as tofu (or worse, color emoji); masks tint via currentColor. */
  .gi {
    display: inline-block;
    width: var(--fs-icon);
    height: var(--fs-icon);
    vertical-align: -0.12em;
    background-color: currentColor;
    -webkit-mask: var(--m) center/contain no-repeat;
    mask: var(--m) center/contain no-repeat;
  }
  .tile.sub .gi { width: var(--fs-label); height: var(--fs-label); }
  .gi-prompt { --m: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M5 3l6 5-6 5" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'); }
  .gi-spark { --m: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M8 1v14M2.2 4.5l11.6 7M13.8 4.5l-11.6 7" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>'); }
  .gi-link { --m: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M2 5h10M9.5 2.5L12 5l-2.5 2.5M14 11H4m2.5-2.5L4 11l2.5 2.5" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'); }
  .gi-grid { --m: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="black" stroke-width="1.8"/><rect x="5.5" y="5.5" width="5" height="5" fill="black"/></svg>'); }
  .gi-elbow { --m: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M4 2v9h9" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'); }
  .t-agent {
    font-size: var(--fs-label);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .t-agent.instance { color: var(--accent-orange); }
  .t-agent.generic { color: var(--text-secondary); }
  .t-count { font-size: var(--fs-eyebrow); color: var(--text-tertiary); flex: none; margin-left: auto; }
  .t-notif {
    flex: none;
    min-width: calc(var(--fs-eyebrow) * 1.6);
    padding: 0 3px;
    border-radius: 999px;
    background: var(--accent-red);
    color: #fff;
    font-size: var(--fs-eyebrow);
    font-weight: 700;
    text-align: center;
  }
  .t-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; margin-left: auto; }
  .t-dot.working { background: var(--accent-green); animation: pulse-green 2s ease-in-out infinite; }
  .t-dot.waiting_input { background: var(--accent-yellow); animation: pulse-yellow 2s ease-in-out infinite; }
  .t-dot.error { background: var(--accent-red); }
  .t-dot.idle { background: var(--text-tertiary); }
  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0.4); }
    50%      { box-shadow: 0 0 0 4px rgba(63,185,80,0); }
  }
  @keyframes pulse-yellow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210,153,34,0.4); }
    50%      { box-shadow: 0 0 0 4px rgba(210,153,34,0); }
  }

  .tile-label {
    text-align: center;
    font-size: var(--fs-label);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-top: 1px;
  }
  .tile.active .tile-label { color: var(--text-primary); font-weight: 600; }

  .tile-ctx {
    height: 2px;
    border-radius: 1px;
    background: var(--border-subtle);
    margin-top: 3px;
    overflow: hidden;
  }
  .tile-ctx i { display: block; height: 100%; }
  .ctx-ok { background: var(--accent-orange); }
  .ctx-warn { background: var(--accent-yellow); }
  .ctx-crit { background: var(--accent-red); }

  /* Pane sub-tiles: single line, extra left indent. */
  .tile.sub {
    margin-left: calc(var(--tile-margin) + 12px);
    padding: 2px 4px;
  }
  .tile.sub .tile-iconline { min-height: calc(var(--fs-label) * 1.4); font-size: var(--fs-label); }
  .tile.sub .t-label-inline {
    font-size: var(--fs-label);
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .tile.sub.active .t-label-inline { color: var(--text-primary); font-weight: 600; }
  .tile.sub.hidden-pane { opacity: 0.45; }
  .tile.sub.hidden-pane .t-label-inline { font-style: italic; }

  /* ── Overflow + sync rows ── */
  .rail-row {
    padding: 2px 6px 2px 10px;
    font-size: var(--fs-eyebrow);
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
  }
  .rail-row.actionable { cursor: pointer; }
  .rail-row.actionable:hover { background: var(--bg-elevated); color: var(--text-primary); }

  /* ── Dock ── */
  .dock {
    flex: none;
    display: flex;
    gap: 2px;
    padding: 5px 4px 5px 6px;
    border-top: 1px solid var(--border-subtle);
    margin-top: 8px;
  }
  .dock button {
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    font-family: var(--font-ui);
    font-size: var(--fs-eyebrow);
    padding: 2px 5px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .dock button:hover, .dock button.open { background: var(--bg-elevated); color: var(--text-primary); }

  /* ── Flyout (info hover) and drawers (widget click) ── */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
  }
  body.drawer-open .scrim { display: block; }

  .flyout {
    position: absolute;
    right: 0;
    display: none;
    max-width: 100%;
    max-height: calc(100% - 16px);
    overflow-y: auto;
    background: var(--bg-elevated);   /* opaque: overlays terminal content */
    border: 1px solid var(--border-default);
    border-right: 3px solid var(--accent-orange);
    border-radius: var(--radius-md) 0 0 var(--radius-md);
    box-shadow: -6px 4px 18px rgba(0,0,0,0.55);
    padding: 8px 12px 8px 10px;
    font-size: var(--fs-detail);
  }
  body.pos-left .flyout {
    right: auto;
    left: 0;
    border-right: 1px solid var(--border-default);
    border-left: 3px solid var(--accent-orange);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    box-shadow: 6px 4px 18px rgba(0,0,0,0.55);
  }
  body.flyout-open .flyout, body.drawer-open .flyout { display: block; }
  .flyout.acc-green { border-right-color: var(--accent-green); }
  .flyout.acc-yellow { border-right-color: var(--accent-yellow); }
  .flyout.acc-red { border-right-color: var(--accent-red); }
  body.pos-left .flyout.acc-green { border-left-color: var(--accent-green); }
  body.pos-left .flyout.acc-yellow { border-left-color: var(--accent-yellow); }
  body.pos-left .flyout.acc-red { border-left-color: var(--accent-red); }

  .fly-title {
    font-size: calc(var(--fs-detail) * 1.2);
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fly-title.claude { color: var(--accent-orange); }
  .fly-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    margin: 2px 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .fly-row .sdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .fly-ctx { height: 3px; border-radius: 2px; background: var(--border-subtle); margin: 6px 0 2px; overflow: hidden; }
  .fly-ctx i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-orange), rgba(219,139,11,0.3)); }
  .fly-stats { color: var(--text-tertiary); font-family: var(--font-mono); font-size: calc(var(--fs-detail) * 0.92); margin-top: 4px; }
  .stat-add { color: var(--accent-green); }
  .stat-remove { color: var(--accent-red); }
  .fly-chips { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .fly-chips button {
    border: none;
    border-radius: 3px;
    padding: 2px 8px;
    background: rgba(255,255,255,0.08);
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: calc(var(--fs-detail) * 0.92);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .fly-chips button:hover { background: rgba(255,255,255,0.16); color: var(--text-primary); }
  .fly-notif { margin-top: 6px; padding: 4px 8px; border-radius: var(--radius-sm); background: rgba(248,81,73,0.12); color: var(--text-secondary); }
  .fly-notif b { color: var(--accent-red); }

  /* Theme drawer content */
  .theme-list { max-height: 50vh; overflow-y: auto; margin-top: 4px; }
  .theme-list::-webkit-scrollbar { width: 4px; }
  .theme-list::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }
  .theme-row {
    padding: 5px 8px;
    color: var(--text-secondary);
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .theme-row:hover { background: var(--bg-surface); color: var(--text-primary); }
  .theme-row.active { color: var(--accent-orange); font-weight: 600; }
  .theme-row.search { color: var(--accent-blue); border-bottom: 1px solid var(--border-subtle); border-radius: 0; margin-bottom: 3px; position: sticky; top: 0; background: var(--bg-elevated); }

  /* Stats drawer content (Windows-only data) */
  .stats-line { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); margin: 4px 0; flex-wrap: wrap; }
  .stats-line .sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
  .budget-label { display: flex; justify-content: space-between; color: var(--text-secondary); margin: 6px 0 3px; gap: 8px; }
  .budget-bar { height: 4px; border-radius: 2px; background: var(--border-subtle); overflow: hidden; }
  .budget-bar i { display: block; height: 100%; border-radius: 2px; transition: width 0.3s ease; }
  .budget-green { background: var(--accent-green); }
  .budget-yellow { background: var(--accent-yellow); }
  .budget-red { background: var(--accent-red); }
</style>
</head>
<body>

<div class="flyout-area" id="flyout-area">
  <div class="scrim" id="scrim"></div>
  <div class="flyout" id="flyout"></div>
</div>
<div class="rail" id="rail">
  <div class="rail-scroll" id="tab-list"></div>
  <div class="dock" id="dock">
    <button onclick="sendAction({type:'new_tab'})">+</button>
    <button id="btn-theme" onclick="toggleDrawer('theme')">theme</button>
    <button id="btn-stats" style="display:none" onclick="toggleDrawer('stats')">$</button>
  </div>
</div>

<script>
// ── constants / state ──────────────────────────────────────────────────────
// Populated at build time by the Rust side (WebViewSidebar::new), which
// replaces the "[]" with the JSON array of available color-scheme names.
var ALL_SCHEMES = [];
var _state = null;
var _currentScheme = null;
var _railWidth = window.innerWidth;   // rail width when no flyout is open
var _flyout = null;                    // {kind:'tab'|'pane'|'tmux', ...} or {kind:'drawer', which}
var _hoverTimer = null;
var FLYOUT_DELAY = 200;
// Flyout width follows the detail font: ~38 average characters (mirrors the
// GPU side), floored at the 264px reference.
function flyoutWidth() {
  var scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale')) || 1;
  return Math.max(264, Math.round(11 * scale * 0.62 * 38));
}

// ── IPC ────────────────────────────────────────────────────────────────────
var _actionDebounce = {};
function sendAction(action) {
  var key = action.type;
  var now = Date.now();
  // Debounce, EXCEPT actions where a rapid pair is legitimate: refocus,
  // activation, and set_flyout (an open/close pair within 400ms is exactly
  // what a quick hover produces — swallowing the close wedges the drawer).
  if (key !== 'refocus' && key !== 'activate_tab' && key !== 'activate_pane' && key !== 'set_flyout') {
    if (_actionDebounce[key] && (now - _actionDebounce[key]) < 400) return;
    _actionDebounce[key] = now;
  }
  window.ipc.postMessage(JSON.stringify(action));
}

function escHtml(s) {
  var div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

// ── scale: rail width drives the type, capped at 1.15x ────────────────────
function applyScale() {
  var scale = Math.min(_railWidth / 180, 1.15);
  scale = Math.max(scale, 0.72);
  document.documentElement.style.setProperty('--scale', scale.toFixed(3));
}
window.addEventListener('resize', function () {
  if (!document.body.classList.contains('flyout-open') &&
      !document.body.classList.contains('drawer-open')) {
    _railWidth = window.innerWidth;
    document.documentElement.style.setProperty('--rail-w', '100%');
    applyScale();
  } else {
    // Host widened for the flyout: pin the rail at its remembered width.
    document.documentElement.style.setProperty('--rail-w', _railWidth + 'px');
  }
});

// ── flyout open/close ──────────────────────────────────────────────────────
function openFlyout(desc, anchorY) {
  _flyout = desc;
  var fly = document.getElementById('flyout');
  fly.innerHTML = desc.html;
  fly.className = 'flyout' + (desc.accent ? ' acc-' + desc.accent : '');
  document.documentElement.style.setProperty('--rail-w', _railWidth + 'px');
  document.body.classList.add(desc.kind === 'drawer' ? 'drawer-open' : 'flyout-open');
  var w = flyoutWidth();
  fly.style.width = w + 'px';
  // Anchor vertically near the source tile, clamped to the viewport.
  var h = Math.min(fly.scrollHeight + 20, window.innerHeight - 16);
  var y = Math.max(4, Math.min(anchorY || 4, window.innerHeight - h - 8));
  fly.style.top = y + 'px';
  sendAction({ type: 'set_flyout', open: true, width: w + 16 });
}

function closeFlyout() {
  if (!_flyout) return;
  _flyout = null;
  document.body.classList.remove('flyout-open', 'drawer-open');
  document.getElementById('flyout').innerHTML = '';
  document.documentElement.style.setProperty('--rail-w', '100%');
  sendAction({ type: 'set_flyout', open: false, width: 0 });
  document.querySelectorAll('.dock button.open').forEach(function (b) { b.classList.remove('open'); });
}

// Hover plumbing: info flyouts open after a delay; moving into the flyout
// keeps them; leaving both closes. Drawers (theme/stats) are click-toggled.
function armHover(el, buildDesc) {
  el.addEventListener('mouseenter', function () {
    clearTimeout(_hoverTimer);
    _hoverTimer = setTimeout(function () {
      var d = buildDesc();
      if (d) openFlyout(d, el.getBoundingClientRect().top);
    }, FLYOUT_DELAY);
  });
  el.addEventListener('mouseleave', function () { clearTimeout(_hoverTimer); });
}
document.getElementById('flyout-area').addEventListener('mouseleave', function () {
  if (_flyout && _flyout.kind !== 'drawer') closeFlyout();
});
document.getElementById('rail').addEventListener('mouseleave', function (e) {
  // Leaving the rail toward anything but the flyout area closes an info flyout.
  if (_flyout && _flyout.kind !== 'drawer') {
    var toEl = e.relatedTarget;
    if (!toEl || !toEl.closest || !toEl.closest('.flyout-area')) closeFlyout();
  }
});
document.getElementById('scrim').addEventListener('click', function () {
  closeFlyout();
  sendAction({ type: 'refocus' });
});

// ── render helpers ─────────────────────────────────────────────────────────
function statusLabel(st) {
  return st === 'working' ? 'working'
    : st === 'waiting_input' ? 'awaiting input'
    : st === 'error' ? 'error' : 'idle';
}
function statusColor(st) {
  return st === 'working' ? 'var(--accent-green)'
    : st === 'waiting_input' ? 'var(--accent-yellow)'
    : st === 'error' ? 'var(--accent-red)' : 'var(--text-tertiary)';
}
function statusTint(st) {
  return st === 'working' ? 'st-green'
    : st === 'waiting_input' ? 'st-yellow'
    : st === 'error' ? 'st-red' : '';
}
function accentOf(st) {
  return st === 'working' ? 'green' : st === 'waiting_input' ? 'yellow' : st === 'error' ? 'red' : null;
}
function lastComponent(p) {
  if (!p) return '';
  var parts = String(p).replace(/\/+$/, '').split('/');
  return parts[parts.length - 1] || p;
}
function ctxClass(pct) { return pct >= 90 ? 'ctx-crit' : pct >= 70 ? 'ctx-warn' : 'ctx-ok'; }

// ── flyout content builders (fed from the SAME state json) ────────────────
function claudeFlyoutHtml(claude, title, cwd, branch, extra) {
  var html = '<div class="fly-title claude">' + escHtml(title) + '</div>';
  var st = (claude && claude.status) || 'idle';
  html += '<div class="fly-row"><span class="sdot" style="background:' + statusColor(st) + '"></span>'
       + '<span style="color:' + statusColor(st) + '">' + statusLabel(st) + '</span>';
  if (claude && claude.host) html += '<span style="margin-left:auto;color:var(--text-tertiary)">' + escHtml(claude.host) + '</span>';
  html += '</div>';
  if (cwd) {
    html += '<div class="fly-row">' + escHtml(cwd)
         + (branch ? ' <span style="color:var(--text-tertiary)">⎇ ' + escHtml(branch) + '</span>' : '')
         + '</div>';
  }
  if (claude && claude.contextPct != null) {
    html += '<div class="fly-ctx"><i style="width:' + claude.contextPct + '%"></i></div>';
  }
  var parts = [];
  if (claude && claude.contextPct != null) parts.push('ctx ' + claude.contextPct + '%');
  if (claude && claude.costUsd != null) parts.push('$' + Number(claude.costUsd).toFixed(2));
  if (claude && claude.durationMs != null) {
    var mins = Math.floor(claude.durationMs / 60000);
    if (mins > 0) parts.push(mins + 'm');
  }
  var lines = '';
  if (claude && claude.linesAdded > 0) lines += '<span class="stat-add">+' + claude.linesAdded + '</span> ';
  if (claude && claude.linesRemoved > 0) lines += '<span class="stat-remove">-' + claude.linesRemoved + '</span>';
  if (parts.length || lines) {
    html += '<div class="fly-stats">' + parts.join(' · ') + (parts.length && lines ? ' · ' : '') + lines + '</div>';
  }
  return html + (extra || '');
}

function shellFlyoutHtml(title, cwd, branch, extra) {
  var html = '<div class="fly-title">' + escHtml(title) + '</div>';
  if (cwd) html += '<div class="fly-row">' + escHtml(cwd) + '</div>';
  if (branch) html += '<div class="fly-row" style="color:var(--text-tertiary)">⎇ ' + escHtml(branch) + '</div>';
  return html + (extra || '');
}

function chipsHtml(chips) {
  var html = '<div class="fly-chips">';
  chips.forEach(function (c) { html += '<button onclick="' + c.onclick + '">' + escHtml(c.label) + '</button>'; });
  return html + '</div>';
}

window.flyClose = function (kind, id) {
  closeFlyout();
  sendAction(kind === 'tab' ? { type: 'close_tab', tabIdx: id } : { type: 'close_pane', paneId: id });
};
window.flyMute = function (paneId) { closeFlyout(); sendAction({ type: 'toggle_mute', paneId: paneId }); };
window.flyZoomReset = function () { closeFlyout(); sendAction({ type: 'reset_zoom' }); };
window.flyHide = function (paneId) { closeFlyout(); sendAction({ type: 'toggle_hidden', paneId: paneId }); };
window.flyUnhide = function (paneId) { closeFlyout(); sendAction({ type: 'unhide_pane', paneId: paneId }); };
window.flyAttach = function (box, session, mode) {
  closeFlyout();
  sendAction({ type: 'attach_tmux_session', box: box, session: session, mode: mode });
};

function tabFlyoutDesc(tab) {
  return function () {
    var claude = tab.claudeInfo;
    var notif = tab.hasNotification
      ? '<div class="fly-notif"><b>● ' + (tab.notificationCount || 1) + '</b> notification' + ((tab.notificationCount || 1) > 1 ? 's' : '') + '</div>'
      : '';
    var zoom = tab.zoomPct
      ? '<div class="fly-row" style="color:var(--text-tertiary)">zoom ' + tab.zoomPct + '%</div>'
      : '';
    var chips = [{ label: 'close', onclick: 'flyClose(\'tab\',' + tab.tabIdx + ')' }];
    if (tab.activePaneId != null) {
      chips.push({ label: tab.notificationsMuted ? 'unmute' : 'mute', onclick: 'flyMute(' + tab.activePaneId + ')' });
    }
    if (tab.zoomPct) chips.push({ label: 'reset zoom', onclick: 'flyZoomReset()' });
    var body = claude
      ? claudeFlyoutHtml(claude, claude.model || 'claude', tab.cwdShort, tab.gitBranch, notif + zoom + chipsHtml(chips))
      : shellFlyoutHtml(tab.cwdShort || tab.title || 'Terminal', tab.cwdShort, tab.gitBranch, notif + zoom + chipsHtml(chips));
    return { kind: 'tab', html: body, accent: claude ? accentOf(claude.status) : null };
  };
}

function paneFlyoutDesc(tab, pane) {
  return function () {
    var claude = pane.claudeInfo;
    var chips = [{ label: 'close', onclick: 'flyClose(\'pane\',' + pane.paneId + ')' }];
    chips.push(pane.isHidden
      ? { label: 'show pane', onclick: 'flyUnhide(' + pane.paneId + ')' }
      : { label: 'hide pane', onclick: 'flyHide(' + pane.paneId + ')' });
    var body = claude
      ? claudeFlyoutHtml(claude, claude.model || 'claude', pane.cwdShort, null, chipsHtml(chips))
      : shellFlyoutHtml(pane.title || pane.cwdShort || 'pane', pane.cwdShort, null, chipsHtml(chips));
    return { kind: 'pane', html: body, accent: claude ? accentOf(claude.status) : null };
  };
}

function tmuxFlyoutDesc(box, s) {
  return function () {
    var html = '<div class="fly-title' + (s.agentIsInstance ? ' claude' : '') + '">' + escHtml(s.name) + '</div>';
    var dotColor = box.status === 'ok' ? 'var(--accent-green)' : box.status === 'unreachable' ? 'var(--accent-red)' : 'var(--text-tertiary)';
    html += '<div class="fly-row"><span class="sdot" style="background:' + dotColor + '"></span>'
         + escHtml(box.box) + ' · ' + (box.status === 'ok' ? 'reachable' : escHtml(box.status)) + '</div>';
    html += '<div class="fly-row">' + s.windows + ' window' + (s.windows === 1 ? '' : 's') + (s.attached ? ' · attached' : '') + '</div>';
    if (s.agent) {
      html += '<div class="fly-row" style="color:var(--accent-orange)">'
           + (s.agentIsInstance ? '⇄ ' + escHtml(s.agent) + ' (interconnect)' : 'running ' + escHtml(s.agent)) + '</div>';
    }
    var bx = JSON.stringify(box.box).replace(/"/g, '&quot;');
    var sn = JSON.stringify(s.name).replace(/"/g, '&quot;');
    html += chipsHtml([
      { label: 'attach in split', onclick: 'flyAttach(' + bx + ',' + sn + ',\'split\')' },
      { label: 'attach in pane', onclick: 'flyAttach(' + bx + ',' + sn + ',\'pane\')' },
    ]);
    return { kind: 'tmux', html: html, accent: null };
  };
}

// ── drawers ────────────────────────────────────────────────────────────────
function themeDrawerHtml() {
  var html = '<div class="fly-title">Theme</div><div class="theme-list">';
  html += '<div class="theme-row search" data-action="search">⌕ Search all… (Ctrl+Shift+K)</div>';
  for (var i = 0; i < ALL_SCHEMES.length; i++) {
    var name = ALL_SCHEMES[i];
    html += '<div class="theme-row' + (name === _currentScheme ? ' active' : '') + '" data-name="' + escHtml(name) + '">' + escHtml(name) + '</div>';
  }
  return html + '</div>';
}

function statsDrawerHtml(stats) {
  var html = '<div class="fly-title claude">Claude Stats' + (stats.activeSessions ? ' · ' + stats.activeSessions + ' session' + (stats.activeSessions !== 1 ? 's' : '') : '') + '</div>';
  if (stats.activeSessions > 0) {
    html += '<div class="stats-line">';
    if (stats.working > 0) html += '<span><span class="sdot" style="background:var(--accent-green)"></span> ' + stats.working + ' working</span>';
    if (stats.waitingInput > 0) html += '<span><span class="sdot" style="background:var(--accent-yellow)"></span> ' + stats.waitingInput + ' awaiting</span>';
    if (stats.idle > 0) html += '<span><span class="sdot" style="background:var(--text-tertiary)"></span> ' + stats.idle + ' idle</span>';
    if (stats.error > 0) html += '<span><span class="sdot" style="background:var(--accent-red)"></span> ' + stats.error + ' error</span>';
    html += '</div>';
  }
  function budget(label, spent, total, remaining) {
    var h = '<div class="budget-label"><span>' + label + ': $' + (spent || 0).toFixed(2);
    if (total != null) h += ' / $' + total.toFixed(2);
    h += '</span>';
    if (total != null) h += '<span style="color:var(--text-tertiary)">$' + (remaining || 0).toFixed(2) + ' left</span>';
    h += '</div>';
    if (total != null) {
      var pct = Math.min(100, (spent / total) * 100);
      var color = pct < 70 ? 'budget-green' : pct < 90 ? 'budget-yellow' : 'budget-red';
      h += '<div class="budget-bar"><i class="' + color + '" style="width:' + pct.toFixed(1) + '%"></i></div>';
    }
    return h;
  }
  if (stats.dailyBudget != null || stats.dailySpent > 0) html += budget('Daily', stats.dailySpent, stats.dailyBudget, stats.dailyRemaining);
  if (stats.weeklyBudget != null || stats.weeklySpent > 0) html += budget('Weekly', stats.weeklySpent, stats.weeklyBudget, stats.weeklyRemaining);
  var parts = [];
  if (stats.totalCostUsd > 0) parts.push('$' + stats.totalCostUsd.toFixed(2) + ' session');
  if (stats.totalDurationMs > 0) {
    var mins = Math.floor(stats.totalDurationMs / 60000);
    var hrs = Math.floor(mins / 60);
    parts.push(hrs > 0 ? hrs + 'h ' + (mins % 60) + 'm' : mins + 'm');
  }
  var lines = '';
  if (stats.totalLinesAdded > 0) lines += '<span class="stat-add">+' + stats.totalLinesAdded + '</span> ';
  if (stats.totalLinesRemoved > 0) lines += '<span class="stat-remove">-' + stats.totalLinesRemoved + '</span>';
  if (parts.length || lines) html += '<div class="fly-stats">' + parts.join(' · ') + (parts.length && lines ? ' · ' : '') + lines + '</div>';
  if (stats.models && stats.models.length) {
    var mt = stats.models.length <= 3 ? stats.models.join(', ') : stats.models.slice(0, 2).join(', ') + ' +' + (stats.models.length - 2) + ' more';
    html += '<div class="fly-stats">' + escHtml(mt) + '</div>';
  }
  return html;
}

function toggleDrawer(which) {
  if (_flyout && _flyout.kind === 'drawer' && _flyout.which === which) { closeFlyout(); return; }
  closeFlyout();
  var html = which === 'theme' ? themeDrawerHtml() : statsDrawerHtml((_state && _state.claudeStats) || {});
  _flyout = { kind: 'drawer', which: which, html: html, accent: null };
  openFlyout(_flyout, 40);
  var btn = document.getElementById(which === 'theme' ? 'btn-theme' : 'btn-stats');
  if (btn) btn.classList.add('open');
  if (which === 'theme') {
    var active = document.querySelector('.theme-list .theme-row.active');
    if (active) active.scrollIntoView({ block: 'center' });
  }
}

document.getElementById('flyout').addEventListener('click', function (e) {
  var row = e.target.closest('.theme-row');
  if (!row) return;
  if (row.getAttribute('data-action') === 'search') {
    closeFlyout();
    sendAction({ type: 'color_scheme_picker' });
    return;
  }
  var name = row.getAttribute('data-name');
  if (name) {
    _currentScheme = name;
    sendAction({ type: 'apply_color_scheme', name: name });
    closeFlyout();
  }
});

// ── main render ────────────────────────────────────────────────────────────
function renderSidebar(state) {
  _state = state;
  var container = document.getElementById('tab-list');
  if (!container) return;
  container.innerHTML = '';

  document.body.classList.toggle('pos-left', state.sidebarPosition === 'left');

  function eyebrow(name, dotCls, stale) {
    var el = document.createElement('div');
    el.className = 'eyebrow' + (stale ? ' stale' : '');
    el.innerHTML = (dotCls ? '<span class="dot ' + dotCls + '"></span>' : '') + escHtml(name.toUpperCase());
    container.appendChild(el);
  }

  eyebrow('local', null, false);

  (state.tabs || []).forEach(function (tab) {
    var claude = tab.claudeInfo;
    var st = claude ? (claude.status || 'idle') : null;
    var tile = document.createElement('div');
    tile.className = 'tile' + (tab.isActive ? ' active' : '') + (st ? ' ' + statusTint(st) : '')
      + (tab.hasNotification && (!tab.panes || !tab.panes.length) ? ' flashing' : '');
    var iconHtml = claude
      ? '<span class="t-icon claude"><i class="gi gi-spark"></i></span>'
      : '<span class="t-icon"><i class="gi gi-prompt"></i></span>';
    var line1 = '<div class="tile-iconline' + (claude || tab.hasNotification ? '' : ' centered') + '">';
    if (tab.hasNotification) line1 += '<span class="t-notif">' + (tab.notificationCount || 1) + '</span>';
    line1 += iconHtml;
    if (st) line1 += '<span class="t-dot ' + st + '"></span>';
    line1 += '</div>';
    var label = lastComponent(tab.cwdShort) || tab.title || 'terminal';
    var html = line1 + '<div class="tile-label">' + escHtml(label) + '</div>';
    if (claude && claude.contextPct != null) {
      html += '<div class="tile-ctx"><i class="' + ctxClass(claude.contextPct) + '" style="width:' + claude.contextPct + '%"></i></div>';
    }
    tile.innerHTML = html;
    tile.addEventListener('click', function () { sendAction({ type: 'activate_tab', tabIdx: tab.tabIdx }); });
    armHover(tile, tabFlyoutDesc(tab));
    container.appendChild(tile);

    if (tab.panes && tab.panes.length > 1) {
      tab.panes.forEach(function (pane) {
        var pClaude = pane.claudeInfo;
        var pst = pClaude ? (pClaude.status || 'idle') : null;
        var sub = document.createElement('div');
        sub.className = 'tile sub' + (pane.isActive && tab.isActive ? ' active' : '')
          + (pst ? ' ' + statusTint(pst) : '') + (pane.isHidden ? ' hidden-pane' : '')
          + (pane.hasNotification ? ' flashing' : '');
        var icon = pClaude
          ? '<span class="t-icon claude"><i class="gi gi-spark"></i></span>'
          : '<span class="t-icon"><i class="gi gi-elbow"></i></span>';
        var plabel = pane.isHidden ? (pane.title || 'hidden') : (lastComponent(pane.cwdShort) || pane.title || 'pane');
        var line = '<div class="tile-iconline">' + icon
          + '<span class="t-label-inline">' + escHtml(plabel) + '</span>'
          + (pst ? '<span class="t-dot ' + pst + '"></span>' : '') + '</div>';
        sub.innerHTML = line;
        sub.addEventListener('click', function () {
          if (pane.isHidden) sendAction({ type: 'unhide_pane', paneId: pane.paneId });
          else sendAction({ type: 'activate_pane', tabIdx: tab.tabIdx, paneIdx: pane.paneIdx });
        });
        armHover(sub, paneFlyoutDesc(tab, pane));
        container.appendChild(sub);
      });
    }
  });

  // Tmux boxes
  var boxes = state.tmuxSessions || [];
  var hiddenCount = 0;
  boxes.forEach(function (box) {
    if (!box.sessions || !box.sessions.length) {
      if (box.status !== 'ok') {
        eyebrow(box.box, box.status === 'unreachable' ? 'dot-red' : 'dot-gray', true);
        if (box.error) {
          var err = document.createElement('div');
          err.className = 'box-error';
          err.title = box.error;
          err.textContent = box.error;
          container.appendChild(err);
        }
      }
      return;
    }
    var stale = box.stale || box.status !== 'ok';
    eyebrow(box.box, box.status === 'ok' ? 'dot-green' : box.status === 'unreachable' ? 'dot-red' : 'dot-gray', stale);
    if (box.status === 'unreachable' && box.error) {
      var err2 = document.createElement('div');
      err2.className = 'box-error';
      err2.title = box.error;
      err2.textContent = box.error;
      container.appendChild(err2);
    }
    box.sessions.forEach(function (s) {
      var tile = document.createElement('div');
      tile.className = 'tile' + (stale || s.attached ? ' stale' : '');
      var line1 = '<div class="tile-iconline' + (s.agent ? '' : ' centered') + '">';
      if (s.agent) {
        line1 += '<span class="t-icon ' + (s.agentIsInstance ? 'instance' : '') + '"><i class="gi gi-link"></i></span>'
          + '<span class="t-agent ' + (s.agentIsInstance ? 'instance' : 'generic') + '">' + escHtml(s.agent) + '</span>';
      } else {
        line1 += '<span class="t-icon"><i class="gi gi-grid"></i></span>';
      }
      var count = '';
      if (s.windows > 1) count = String(Math.min(s.windows, 9)) + (s.attached ? '●' : '');
      else if (s.attached) count = '●';
      if (count) line1 += '<span class="t-count">' + count + '</span>';
      line1 += '</div>';
      tile.innerHTML = line1 + '<div class="tile-label">' + escHtml(s.name) + '</div>';
      tile.title = 'Attach in a split pane';
      tile.addEventListener('click', function () {
        sendAction({ type: 'attach_tmux_session', box: box.box, session: s.name, mode: 'split' });
      });
      armHover(tile, tmuxFlyoutDesc(box, s));
      container.appendChild(tile);
    });
  });

  // Sync row (only when tmux discovery is active)
  if (boxes.length) {
    var sync = document.createElement('div');
    sync.className = 'rail-row actionable';
    sync.textContent = 'sync';
    sync.addEventListener('click', function () { sendAction({ type: 'refresh_tmux_sessions' }); });
    container.appendChild(sync);
  }

  // Stats dock chip only when the host supplies aggregate stats.
  var statsBtn = document.getElementById('btn-stats');
  if (statsBtn) statsBtn.style.display = state.claudeStats ? '' : 'none';

  if (typeof state.activeColorScheme !== 'undefined') {
    _currentScheme = state.activeColorScheme;
  }

  applyScale();
}

// Called from Rust via evaluate_script
window.__updateState = renderSidebar;

// Prevent WebView from keeping keyboard focus, but allow button clicks to complete.
var _clickPending = false;
document.addEventListener('mousedown', function (e) {
  if (e.target.closest('button, .theme-row, .tile, .rail-row')) {
    _clickPending = true;
    return;
  }
  sendAction({ type: 'refocus' });
}, true);
document.addEventListener('click', function () {
  if (_clickPending) {
    _clickPending = false;
    setTimeout(function () { sendAction({ type: 'refocus' }); }, 80);
  }
}, true);
document.addEventListener('mouseup', function () {
  if (!_clickPending) sendAction({ type: 'refocus' });
}, true);
window.addEventListener('focus', function () {
  if (!_clickPending) sendAction({ type: 'refocus' });
});
document.addEventListener('focusin', function (e) {
  if (e.target && e.target.blur) e.target.blur();
  if (!_clickPending) sendAction({ type: 'refocus' });
});

applyScale();
</script>

</body>
</html>
